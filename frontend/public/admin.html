<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">

    <header class="bg-slate-800 text-white px-6 py-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">News Analytics Admin Portal (Live DB Link)</h1>
        <div class="flex items-center space-x-4">
            <button onclick="loadPendingTasks()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded transition">Refresh Queue</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-3 gap-6">
        
        <div class="col-span-1 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col h-[75vh]">
            <h2 class="text-lg font-semibold mb-4 text-gray-700 flex justify-between items-center">
                <span>Review Queue</span>
                <span id="queueCount" class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded-full">0</span>
            </h2>
            <div id="taskList" class="space-y-3 overflow-y-auto flex-1 pr-1">
                <p class="text-sm text-gray-400 text-center py-8">Fetching records from backend...</p>
            </div>
        </div>

        <div class="col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between h-[75vh]">
            
            <div id="auditContainer" class="hidden flex-1 overflow-y-auto space-y-6 pr-2">
                <div class="border-b pb-4 flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold text-blue-600 tracking-wider uppercase">Active Review</span>
                        <h2 id="activeTaskTitle" class="text-xl font-bold text-slate-800 mt-0.5">Task Detail</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-gray-400">Database Reference</span>
                        <p id="activeTaskIdDisplay" class="text-sm font-mono text-slate-600">ID: --</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4 bg-slate-50 p-3 rounded-lg text-sm">
                    <div>
                        <span class="text-gray-500 block text-xs">Similarity Score</span> 
                        <strong id="activeSimilarity" class="text-blue-600 text-base">--</strong>
                    </div>
                    <div class="col-span-2">
                        <span class="text-gray-500 block text-xs">Current Status in DB</span> 
                        <span id="activeCurrentStatus" class="font-semibold text-gray-700">--</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-gray-600 uppercase tracking-wider mb-3">Similar Text Chunks Preview</h3>
                    <div id="alignmentMatrixContainer" class="space-y-3">
                    </div>
                </div>

                <div class="space-y-4 border-t pt-4">
                    <h3 class="text-sm font-bold text-gray-600 uppercase tracking-wider">Audit Action Box</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Update Status (`review_status`)</label>
                        <select id="reviewStatus" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-500">
                            <option value="pending">Pending (Keep in Queue)</option>
                            <option value="approved">Approved (Clear for Dashboard)</option>
                            <option value="flagged">Flagged (Highly Biased / Outlier)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Admin Notes (`admin_notes`)</label>
                        <textarea id="adminNotes" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="Input audit notes for compliance tracking..."></textarea>
                    </div>
                </div>
            </div>

            <div id="auditPlaceholder" class="flex-1 flex flex-col items-center justify-center text-gray-400">
                <p class="text-sm">Click a comparison task from the left queue to audit.</p>
            </div>

            <div id="actionButtonContainer" class="mt-4 border-t pt-4 flex justify-end hidden">
                <button onclick="submitAudit()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg shadow text-sm transition">
                    Save Changes & Update Database
                </button>
            </div>
        </div>

    </main>

    <script>
        const BACKEND_URL = 'http://localhost:8001'; 
        
        let allTasks = [];
        let currentlySelectedTaskId = null;

        document.addEventListener('DOMContentLoaded', loadPendingTasks);

        async function loadPendingTasks() {
            const taskListContainer = document.getElementById('taskList');
            taskListContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">Loading live data...</p>';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/comparisons`); 
                if (!response.ok) throw new Error('Backend response error');
                
                allTasks = await response.json();
                document.getElementById('queueCount').innerText = allTasks.length;
                
                renderTaskList();
            } catch (err) {
                console.error(err);
                taskListContainer.innerHTML = `
                    <div class="text-center py-6 text-red-500 text-sm">
                        <p class="font-semibold">Connection Failed</p>
                        <p class="text-xs text-gray-400 mt-1">Is FastAPI running at ${BACKEND_URL}?</p>
                    </div>`;
            }
        }

        function renderTaskList() {
            const taskListContainer = document.getElementById('taskList');
            if (allTasks.length === 0) {
                taskListContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">All caught up! No pending reviews.</p>';
                return;
            }

            taskListContainer.innerHTML = allTasks.map(task => {
                const id = task.comparison_id || task.id;
                const score = task.similarity_score !== undefined ? task.similarity_score : 'N/A';
                const status = (task.review_status || 'pending').toUpperCase();
                
                const statusClass = status === 'PENDING' ? 'bg-amber-100 text-amber-800' : 
                                    status === 'APPROVED' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800';

                return `
                    <div onclick="selectTask(${id})" id="card-${id}" class="p-3 bg-white border border-gray-200 hover:border-blue-400 rounded-lg shadow-sm cursor-pointer transition flex flex-col justify-between relative group">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-mono font-bold text-gray-400">ID: #${id}</span>
                            <div class="flex items-center space-x-2">
                                <span class="${statusClass} text-[9px] font-bold px-1.5 py-0.5 rounded">${status}</span>
                                <button onclick="deleteTask(${id}, event)" class="text-gray-300 hover:text-red-500 transition p-0.5 rounded" title="Delete record permanently">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-sm font-medium text-slate-700 truncate mb-2">Comparison Task #${id}</p>
                        <div class="text-[11px] text-gray-500 flex justify-between items-center">
                            <span>Similarity: <strong class="text-blue-600">${typeof score === 'number' ? score.toFixed(2) : score}</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectTask(id) {
            currentlySelectedTaskId = id;
            const task = allTasks.find(t => (t.comparison_id || t.id) === id);
            if (!task) return;

            allTasks.forEach(t => {
                const card = document.getElementById(`card-${t.comparison_id || t.id}`);
                if (card) card.classList.remove('border-blue-500', 'bg-blue-50/30');
            });
            const activeCard = document.getElementById(`card-${id}`);
            if (activeCard) activeCard.classList.add('border-blue-500', 'bg-blue-50/30');

            document.getElementById('activeTaskTitle').innerText = `Review Task Matrix #${id}`;
            document.getElementById('activeTaskIdDisplay').innerText = `DB ID: ${id}`;
            document.getElementById('activeSimilarity').innerText = typeof task.similarity_score === 'number' ? task.similarity_score.toFixed(2) : task.similarity_score;
            document.getElementById('activeCurrentStatus').innerText = (task.review_status || 'pending').toUpperCase();
            
            document.getElementById('reviewStatus').value = task.review_status || 'pending';
            document.getElementById('adminNotes').value = task.admin_notes || '';

            const matrixContainer = document.getElementById('alignmentMatrixContainer');
            let matrixData = task.alignment_matrix;
            
            if (typeof matrixData === 'string') {
                try { matrixData = JSON.parse(matrixData); } catch(e) { matrixData = []; }
            }

            if (!matrixData || !Array.isArray(matrixData) || matrixData.length === 0) {
                matrixContainer.innerHTML = `<p class="text-xs text-gray-400 italic bg-gray-50 p-3 rounded-lg border border-dashed">No text chunks alignment matrix details available for this record.</p>`;
            } else {
                matrixContainer.innerHTML = matrixData.map((match, idx) => {
                    const scorePct = typeof match.score === 'number' ? `${(match.score * 100).toFixed(0)}%` : 'N/A';
                    const relationshipLabel = {
                        aligned: 'Similar',
                        partially_aligned: 'Partially similar',
                        divergent: 'Divergent'
                    }[match.label] || 'Similar';
                    return `
                        <div class="bg-slate-50 border border-gray-200 rounded-lg p-3 text-xs shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-gray-700">Match #${idx + 1} <span class="text-gray-400 font-normal">(Confidence: ${scorePct})</span></span>
                                <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] font-medium uppercase">${relationshipLabel}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-white p-2.5 rounded border-l-4 border-orange-500 shadow-inner max-h-32 overflow-y-auto">
                                    <span class="text-[9px] font-bold text-orange-600 block mb-1 tracking-wider">ARTICLE A CHUNK</span>
                                    <p class="text-gray-600 leading-relaxed whitespace-pre-wrap">${match.a_text_preview || 'N/A'}</p>
                                </div>
                                <div class="bg-white p-2.5 rounded border-l-4 border-blue-500 shadow-inner max-h-32 overflow-y-auto">
                                    <span class="text-[9px] font-bold text-blue-600 block mb-1 tracking-wider">ARTICLE B CHUNK</span>
                                    <p class="text-gray-600 leading-relaxed whitespace-pre-wrap">${match.b_text_preview || 'N/A'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('auditContainer').classList.remove('hidden');
            document.getElementById('auditPlaceholder').classList.add('hidden');
            document.getElementById('actionButtonContainer').classList.remove('hidden');
        }

        async function deleteTask(id, event) {
            event.stopPropagation(); 
            
            if (!confirm(`Danger Zone!\n\nAre you sure you want to permanently delete Task #${id} from the PostgreSQL database? This cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/comparisons/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete target record from database.');

                alert(`[PostgreSQL 17 Success]\n\nTask #${id} has been completely removed.`);
                
                if (currentlySelectedTaskId === id) {
                    currentlySelectedTaskId = null;
                    document.getElementById('auditContainer').classList.add('hidden');
                    document.getElementById('auditPlaceholder').classList.remove('hidden');
                    document.getElementById('actionButtonContainer').classList.add('hidden');
                }

                await loadPendingTasks();

            } catch (err) {
                alert(`Delete Transaction Failed: ${err.message}`);
            }
        }

        async function submitAudit() {
            if (!currentlySelectedTaskId) return;

            const status = document.getElementById('reviewStatus').value;
            const notes = document.getElementById('adminNotes').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/comparisons/${currentlySelectedTaskId}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_status: status, admin_notes: notes })
                });

                if (!response.ok) throw new Error('Failed to update database record.');

                alert(`[PostgreSQL 17 Success]\n\nTask #${currentlySelectedTaskId} has been updated to "${status.toUpperCase()}"!`);
                
                await loadPendingTasks();
                selectTask(currentlySelectedTaskId);

            } catch (err) {
                alert(`Update Failed: ${err.message}`);
            }
        }
    </script>
</body>
</html>
