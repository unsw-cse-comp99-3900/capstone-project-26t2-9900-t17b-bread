name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  # ─── Linting ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (lint)
        continue-on-error: true
        run: ruff check . --output-format=github

      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check . || echo "::warning::Code formatting issues found. Run 'ruff format .' locally to fix."

  # ─── Type checking ──────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  # ─── Security scan ──────────────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Bandit (code security)
        run: bandit -r app/ -c pyproject.toml --severity-level medium

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt --desc || true

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        continue-on-error: true
        env:
          DATABASE_URL: ""
          TESSERACT_CMD: ""
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml -x --timeout=120 || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ─── Build verification ─────────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify application starts
        env:
          DATABASE_URL: ""
          TESSERACT_CMD: ""
        run: |
          python -c "from app.main import app; print(f'✓ App loaded: {app.title} v{app.version}')"

      - name: Check OpenAPI schema generates
        env:
          DATABASE_URL: ""
          TESSERACT_CMD: ""
        run: |
          python -c "
          from app.main import app
          schema = app.openapi()
          print(f'✓ OpenAPI: {len(schema[\"paths\"])} paths, {len(schema.get(\"components\",{}).get(\"schemas\",{}))} schemas')
          "
