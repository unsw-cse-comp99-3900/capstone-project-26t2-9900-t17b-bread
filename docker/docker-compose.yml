name: narrative-diff

services:
  postgres:
    image: postgres:17
    container_name: narrative-diff-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/database/init_db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:17
    container_name: narrative-diff-db-init
    environment:
      PGPASSWORD: postgres
    volumes:
      - ../database/database/init_db.sql:/init_db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 -f /init_db.sql",
      ]

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: narrative-diff-backend
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
      TESSERACT_CMD: tesseract
      OCR_LANGUAGES: eng
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  admin-backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: narrative-diff-admin-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
    command: ["uvicorn", "admin_server:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: narrative-diff-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
